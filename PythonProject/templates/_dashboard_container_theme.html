{% if current_user.is_authenticated %}
<script>
(function () {
  var root = document.documentElement;
  var prefs = {{ {"theme": current_user.theme or "light", "font": current_user.font_family or "inter", "size": current_user.font_size or "default"}|tojson }};
  root.setAttribute("data-theme", prefs.theme);
  root.setAttribute("data-font", prefs.font);
  root.setAttribute("data-font-size", prefs.size);
}());
</script>
{% endif %}
<link rel="stylesheet" href="{{ url_for('static', filename='professional.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='system-wide-redesign.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
